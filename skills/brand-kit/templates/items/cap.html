<!-- a six-panel cap in the ink colour, three-quarter view facing left: the mark embroidered on the front panels, an accent button, accent edge under the brim -->
<div class="app app-cap studio">
  <div class="shadow"></div>
  <div class="g">
    <svg viewBox="0 0 120 84" aria-hidden="true">
      <defs>
        <radialGradient id="cp-crown" cx=".38" cy=".28" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".2" /><stop offset=".45" stop-color="#fff" stop-opacity=".02" /><stop offset="1" stop-color="#000" stop-opacity=".55" /></radialGradient>
        <linearGradient id="cp-brim" x1="0" y1="0" x2=".3" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".16" /><stop offset=".7" stop-color="#fff" stop-opacity="0" /><stop offset="1" stop-color="#000" stop-opacity=".3" /></linearGradient>
        <linearGradient id="cp-under" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#000" stop-opacity=".55" /><stop offset="1" stop-color="#000" stop-opacity=".25" /></linearGradient>
      </defs>
      <!-- back of the crown (the inside shadow behind the brim) -->
      <path d="M40 58 Q70 64 106 55 L106 58 Q72 68 40 61 Z" fill="#000" opacity=".5" />
      <!-- crown -->
      <path class="cloth" d="M38 58 C34 34 46 13 70 11 C93 10 108 28 107 55 Q72 64 38 58 Z" />
      <path fill="url(#cp-crown)" d="M38 58 C34 34 46 13 70 11 C93 10 108 28 107 55 Q72 64 38 58 Z" />
      <!-- panel seams from the button -->
      <g fill="none" stroke="#000" stroke-opacity=".45" stroke-width=".7">
        <path d="M70 11.5 C58 22 54 40 56 61" />
        <path d="M70 11.5 C82 24 87 40 88 60" />
        <path d="M70 11.5 C50 16 41 32 40 57" stroke-opacity=".3" />
        <path d="M70 11.5 C96 18 104 34 106 54" stroke-opacity=".3" />
      </g>
      <g fill="none" stroke="#fff" stroke-opacity=".07" stroke-width=".5">
        <path d="M71 12.5 C59 23 55 40 57 61" /><path d="M71 12.5 C83 25 88 40 89 60" />
      </g>
      <!-- eyelets -->
      <circle cx="97" cy="27" r="1.1" fill="#000" opacity=".6" /><circle cx="47" cy="29" r="1" fill="#000" opacity=".5" />
      <!-- sweatband line -->
      <path d="M38 58 Q72 64 107 55" fill="none" stroke="#000" stroke-opacity=".45" stroke-width="1.2" />
      <!-- brim: top surface, then its thickness, then the accent edge -->
      <path d="M40 57 Q66 63 92 58 C80 70 52 78 24 77 C10 76 4 72 7 67 C11 61 26 57 40 57 Z" fill="url(#cp-under)" transform="translate(0 2.2)" />
      <path class="brim" d="M40 57 Q66 63 92 58 C80 70 52 78 24 77 C10 76 4 72 7 67 C11 61 26 57 40 57 Z" />
      <path fill="url(#cp-brim)" d="M40 57 Q66 63 92 58 C80 70 52 78 24 77 C10 76 4 72 7 67 C11 61 26 57 40 57 Z" />
      <g fill="none" stroke="#000" stroke-opacity=".35" stroke-width=".45">
        <path d="M37 59.6 Q64 65 87 61" /><path d="M33 62 Q60 68 82 64.5" />
      </g>
      <path class="edge" d="M7.5 69.5 C8 75 18 79.4 28 79.2 C54 78.8 80 71 92 60.4" />
      <!-- top button -->
      <ellipse cx="70" cy="11.2" rx="3.4" ry="1.5" fill="#000" opacity=".4" transform="translate(0 .8)" />
      <ellipse class="btn" cx="70" cy="11" rx="3.2" ry="1.4" />
    </svg>
    <svg class="mk emb" viewBox="0 0 32 32"><use href="#mark" /></svg>
  </div>
</div>
