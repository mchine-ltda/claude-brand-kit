<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>{{BRAND}} Moodboard</title>
<!--
  brand-kit skill · MOODBOARD TEMPLATE.
  A 1600 x 1000 board of seven tiles on a near-black backdrop. Two tiles
  are the same for every brand: the mark (tile 1) and the summary card with
  the type and palette (tile 7). Tiles 2–6 are slots for the business's own
  applications — SLOT_2 … SLOT_6 in brand.json, each an item tag such as
  item:bag (see templates/items and the slot sizes below), a custom drawing,
  or a generated photo (class app app-photo).

  Fill with scripts/fill.mjs, then render:
    node SKILL_DIR/scripts/render.mjs moodboard.html \
      --shot "#board=moodboard.png" --shot "#board=moodboard.jpg"
-->
<!-- FONT_LINKS: Google Fonts <link> tags for the accent and mono faces, e.g.
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" /> -->
{{FONT_LINKS}}
<style>
  /* FONT_FACES: @font-face rules for licensed local display fonts (files in assets/) */
  {{FONT_FACES}}

  :root {
    /* the palette: a quiet base, a light, an ink, and ONE loud accent */
    --base: {{BASE}};          /* e.g. smoke grey #4d4d4d: big surfaces */
    --light: {{LIGHT}};        /* e.g. chalk #f2f1ec: never pure white */
    --accent: {{ACCENT}};      /* e.g. lime #c8ff32: the loud one, glows */
    --accent-deep: {{ACCENT_DEEP}}; /* the accent darkened to read on --light, e.g. #8fc400 */
    --ink: {{INK}};            /* e.g. #1c1c1c: never pure black */
    --night: #0b0b0c;          /* the board's backdrop */
    --sans: {{DISPLAY_FONT}}, ui-sans-serif, system-ui, sans-serif;
    --serif: {{ACCENT_FONT}}, Georgia, serif;
    --mono: {{MONO_FONT}}, ui-monospace, Menlo, monospace;
    --glow-a: color-mix(in oklab, var(--accent) 55%, transparent);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--night); }
  body { min-height: 100vh; display: grid; place-items: center; font-family: var(--sans); color: var(--light); }

  .board {
    width: 1600px; height: 1000px; padding: 40px;
    display: grid;
    grid-template-columns: 360px 250px 250px 1fr;
    grid-template-rows: 330px 130px 1fr;
    gap: 12px;
    background: var(--night);
  }
  .t { position: relative; overflow: hidden; isolation: isolate; border-radius: 18px; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.11); }
  .t::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.1); pointer-events: none; }
  .mono { font-family: var(--mono); text-transform: uppercase; letter-spacing: 0.32em; }

  .wm { display: inline-flex; align-items: baseline; font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
  /* the wordmark, set in the display face. Accent details: <span class="acc">.</span>
     (the accent; the deep accent on light backgrounds). A dot drawn over a
     letter: <span class="dot-over">ı<b></b></span>. Replace per brand. */
  .wm .acc { color: var(--accent); }
  .wm .dot-over { position: relative; }
  .wm .dot-over b { position: absolute; left: 50%; top: 0.05em; width: 0.21em; height: 0.21em; translate: -50% 0; border-radius: 50%; background: var(--accent); }

  /* ---------- 1. the mark, lit from a corner in the accent ---------- */
  .logo {
    grid-area: 1 / 1 / 2 / 2; display: grid; place-items: center;
    background:
      radial-gradient(70% 60% at 0% 0%, var(--glow-a), transparent 60%),
      radial-gradient(120% 100% at 100% 100%, color-mix(in oklab, var(--base) 45%, #000), transparent 70%),
      linear-gradient(145deg, color-mix(in oklab, var(--base) 80%, #fff), var(--base) 45%, color-mix(in oklab, var(--base) 55%, #000));
  }
  .logo svg { width: 46%; color: var(--light); filter: drop-shadow(0 18px 30px rgb(0 0 0 / 0.45)); }

  /* ---------- slots 2–6: the business's own applications (templates/items) ----------
     slot 2 · wide, top middle     (512 × 472): billboard · storefront · laptop · letterhead · cards · box
     slot 3 · wide, top right      (612 × 472): material · storefront · billboard · letterhead · box · cards
     slot 4 · tall, left           (360 × 582): tag · bag · bottle · poster · tee · product
     slot 5 · narrow, bottom       (250 × 440): phone · cup · bottle · mug · bag · product
     slot 6 · narrow, bottom       (250 × 440): mug · cup · bottle · sticker · bag · product */
  .slot2 { grid-area: 1 / 2 / 3 / 4; }
  .slot3 { grid-area: 1 / 4 / 3 / 5; }
  .slot4 { grid-area: 2 / 1 / 4 / 2; }
  .slot5 { grid-area: 3 / 2 / 4 / 3; }
  .slot6 { grid-area: 3 / 3 / 4 / 4; }
{{>items.css}}

  /* ---------- 7. type + palette ---------- */
  .type { grid-area: 3 / 4 / 4 / 5; padding: 38px 40px 34px; display: flex; flex-direction: column; background: radial-gradient(55% 70% at 100% 0%, color-mix(in oklab, var(--accent) 75%, transparent), color-mix(in oklab, var(--accent) 8%, transparent) 60%, transparent 75%), radial-gradient(70% 60% at 0% 100%, #3a3a3a, transparent 70%), linear-gradient(160deg, #262626, #141414); }
  .type .kick { font-size: 11px; color: color-mix(in oklab, var(--light) 82%, transparent); }
  .type h3 { margin-top: 16px; font-size: 66px; line-height: 0.92; font-weight: 700; letter-spacing: -0.03em; text-transform: uppercase; }
  .type .pair { margin-top: 12px; display: flex; gap: 22px; align-items: baseline; font-size: 15px; color: color-mix(in oklab, var(--light) 82%, transparent); }
  .type .pair em { font-family: var(--serif); font-size: 26px; color: var(--light); }
  .type .pair span { font-family: var(--mono); font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase; }
  .type .pal { margin-top: auto; }
  .type .pal p { font-size: 11px; color: color-mix(in oklab, var(--light) 82%, transparent); }
  .type .sw { margin-top: 16px; display: flex; gap: 14px; }
  .type .sw div { display: grid; gap: 7px; }
  .type .sw i { display: block; width: 92px; height: 22px; border-radius: 11px; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.14); }
  .type .sw small { font-family: var(--mono); font-size: 9px; letter-spacing: 0.12em; color: color-mix(in oklab, var(--light) 70%, transparent); text-transform: uppercase; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- MARK: the brand's mark/monogram in a 32x32 box, drawn with currentColor + the accent.
         e.g. a letter built from two or three strokes, with an accent dot. -->
    <symbol id="mark" viewBox="0 0 32 32">
      {{MARK_SVG}}
    </symbol>
  </defs>
</svg>

<main class="board" id="board" aria-label="{{BRAND}} brand moodboard">
  <section class="t logo"><svg viewBox="0 0 32 32"><use href="#mark" /></svg></section>

  <section class="t slot2">{{SLOT_2}}</section>
  <section class="t slot3">{{SLOT_3}}</section>
  <section class="t slot4">{{SLOT_4}}</section>
  <section class="t slot5">{{SLOT_5}}</section>
  <section class="t slot6">{{SLOT_6}}</section>

  <section class="t type">
    <p class="kick mono">{{CATEGORY}}</p>
    <h3>{{DISPLAY_FONT_NAME_LINE_1}}<br />{{DISPLAY_FONT_NAME_LINE_2}}</h3>
    <p class="pair"><em>{{ACCENT_FONT_NAME}}</em><span>{{MONO_FONT_NAME}}</span></p>
    <div class="pal">
      <p class="mono">Color palette</p>
      <div class="sw">
        <div><i style="background:var(--base)"></i><small>{{BASE_NAME}} {{BASE}}</small></div>
        <div><i style="background:var(--light)"></i><small>{{LIGHT_NAME}} {{LIGHT}}</small></div>
        <div><i style="background:var(--ink)"></i><small>{{INK_NAME}} {{INK}}</small></div>
        <div><i style="background:var(--accent)"></i><small>{{ACCENT_NAME}} {{ACCENT}}</small></div>
      </div>
    </div>
  </section>
</main>
</body>
</html>
