<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>{{BRAND}} Applications</title>
<!--
  brand-kit skill · ITEMS GALLERY. The menu of applications, drawn in the
  brand's own colours, so the person can see the options before choosing.
  GALLERY_TILES is a run of tiles, one per candidate item:
    a figure with class "t", a figcaption ("Shopping bag") and the item tag for bag
  Render: node SKILL_DIR/scripts/render.mjs items-gallery.html --scale 1 --shot "#board=applications-menu.jpg"
  (the board grows with the number of tiles; 4 per row)
-->
{{FONT_LINKS}}
<style>
  {{FONT_FACES}}
  :root {
    --base: {{BASE}}; --light: {{LIGHT}}; --accent: {{ACCENT}}; --accent-deep: {{ACCENT_DEEP}}; --ink: {{INK}}; --night: #0b0b0c;
    --sans: {{DISPLAY_FONT}}, ui-sans-serif, system-ui, sans-serif;
    --serif: {{ACCENT_FONT}}, Georgia, serif;
    --mono: {{MONO_FONT}}, ui-monospace, Menlo, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--night); }
  body { font-family: var(--sans); color: var(--light); }
  .board { width: 1600px; padding: 40px; display: grid; gap: 22px; background: var(--night); }
  .board-top { display: flex; justify-content: space-between; font-family: var(--mono); font-size: 12px; letter-spacing: 0.28em; text-transform: uppercase; color: #9a9a96; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .t { position: relative; overflow: hidden; isolation: isolate; aspect-ratio: 1; border-radius: 18px; box-shadow: inset 0 0 0 1px rgb(255 255 255 / 0.11); background: #151515; }
  .t figcaption { position: absolute; z-index: 5; left: 14px; top: 12px; padding: 5px 10px; border-radius: 999px; background: rgb(11 11 12 / 0.7); backdrop-filter: blur(6px); font-family: var(--mono); font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase; color: #ecebe6; }
  {{>items.css}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><symbol id="mark" viewBox="0 0 32 32">{{MARK_SVG}}</symbol></defs></svg>
<main class="board" id="board">
  <div class="board-top"><span>{{BRAND}} · Where the brand lives</span><span>Keep, remove or add</span></div>
  <div class="grid">{{GALLERY_TILES}}</div>
</main>
</body>
</html>
